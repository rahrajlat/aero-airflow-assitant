<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aero Demo</title>
    <style>
      :root {
        --bg: #020817;
        --panel: #0f172a;
        --border: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #0b1327 0%, var(--bg) 55%);
        color: var(--text);
        display: grid;
        place-items: center;
      }

      .wrap {
        width: min(1100px, 92vw);
        padding: 24px;
      }

      .card {
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 24px 60px rgba(2, 6, 23, 0.55);
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(28px, 4vw, 40px);
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      .video-shell {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        border: 1px solid rgba(56, 189, 248, 0.25);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .actions {
        margin-top: 18px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Aero Demo</h1>
        <p>
          This page embeds the project demo video so it can play in a normal browser page,
          which works much more reliably than a raw video tag in GitHub README markup.
        </p>

        <div class="video-shell">
          <iframe
            src="https://www.youtube.com/embed/8SOVYaV-yZE"
            title="Aero demo video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>

        <div class="actions">
          <a href="https://youtu.be/8SOVYaV-yZE" target="_blank" rel="noopener noreferrer">
            Open on YouTube
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
